#      limite em 3, três desses passam. Isso é aceitável num repositório que
#      publica na produção do banco?
#
#   2. H6 diz que credencial no código é CRITICA quando a aplicação carrega o
#      arquivo, e MEDIA quando não carrega. O segredo, porém, está no histórico
#      do Git nos dois casos. A distinção faz sentido, ou é conforto?
